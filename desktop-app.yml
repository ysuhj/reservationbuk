# PC 앱(Windows 설치 파일)을 만들어 Release에 붙입니다.
# - Release를 새로 발행하면 자동으로 실행
# - 또는 Actions 탭 → "PC 앱 만들기" → Run workflow 로 직접 실행
name: PC 앱 만들기

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '설치 파일을 붙일 Release 태그'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: specialroom-windows
          path: desktop/dist/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: desktop/dist/*.exe
